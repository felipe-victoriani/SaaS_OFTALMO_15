<div class="page-content">
  <div class="module-header">
    <h1 class="module-title">
      <i data-lucide="scissors" width="24" height="24" aria-hidden="true"></i>
      Cirúrgico
    </h1>
    <p class="module-subtitle">
      Registro de procedimentos cirúrgicos oftalmológicos (somente admin)
    </p>
  </div>

  <div class="date-filter-bar">
    <label class="form-label" for="data-cirurgico">Data:</label>
    <input
      type="date"
      id="data-cirurgico"
      class="filter-input"
      style="width: auto"
    />
  </div>

  <!-- Formulário (largura máxima 640px) -->
  <div style="max-width: 640px; margin-bottom: 1.5rem">
    <div>
      <div class="form-section">
        <h2 class="form-section-title">
          <i
            data-lucide="plus-circle"
            width="18"
            height="18"
            aria-hidden="true"
          ></i>
          Nova Cirurgia
        </h2>
        <form id="form-cirurgico" novalidate>
          <div class="form-grid">
            <div class="form-group full-width">
              <label class="form-label" for="cir-paciente"
                >Paciente <span class="required">*</span></label
              >
              <input
                type="text"
                id="cir-paciente"
                class="form-input"
                required
              />
            </div>
            <div class="form-group full-width">
              <label class="form-label" for="cir-cirurgiao"
                >Cirurgião <span class="required">*</span></label
              >
              <select id="cir-cirurgiao" class="form-select" required>
                <option value="">Selecione...</option>
                <option>Dra. Mariza</option>
                <option>Dra. Fabiana</option>
                <option>Dra. Mariana</option>
                <option>Dr. Dante</option>
                <option>Dr. Alberto</option>
              </select>
            </div>
            <div class="form-group full-width">
              <label class="form-label" for="cir-auxiliar">Auxiliar</label>
              <select id="cir-auxiliar" class="form-select">
                <option value="">Nenhum</option>
                <option>Dra. Mariza</option>
                <option>Dra. Fabiana</option>
                <option>Dra. Mariana</option>
                <option>Dr. Dante</option>
                <option>Dr. Alberto</option>
              </select>
            </div>
            <div class="form-group full-width">
              <label class="form-label" for="cir-instrumentador"
                >Instrumentador</label
              >
              <input
                type="text"
                id="cir-instrumentador"
                class="form-input"
                placeholder="Nome do instrumentador"
              />
            </div>
            <div class="form-group full-width">
              <label class="form-label" for="cir-tipo"
                >Tipo de Cirurgia <span class="required">*</span></label
              >
              <select id="cir-tipo" class="form-select" required>
                <option value="">Selecione...</option>
                <option>Facoemulsificação</option>
                <option>Facoemulsificação com LIO Premium</option>
                <option>Vitrectomia Posterior</option>
                <option>Vitrectomia Anterior</option>
                <option>Trabeculectomia</option>
                <option>Implante de Válvula de Ahmed</option>
                <option>Pterigio</option>
                <option>Blefaroplastia</option>
                <option>Retina Descolada</option>
                <option>Membrana Epirretiniana</option>
                <option>Oclusão de Veia Retiniana</option>
                <option>Retinopatia Diabética (Laser)</option>
                <option>Cirurgia Refrativa (LASIK)</option>
                <option>Cirurgia Refrativa (PRK)</option>
                <option>Crosslinking Corneano</option>
                <option>Ceratoplastia (Transplante de Córnea)</option>
                <option>Estrabismo</option>
                <option>Dacriocistorrinostomia (DCR)</option>
              </select>
            </div>
            <div class="form-group full-width">
              <label class="form-label" for="cir-olho"
                >Olho Operado <span class="required">*</span></label
              >
              <select id="cir-olho" class="form-select" required>
                <option value="">Selecione...</option>
                <option>Olho Direito (OD)</option>
                <option>Olho Esquerdo (OE)</option>
                <option>Ambos (AO)</option>
              </select>
            </div>

            <!-- LIO Toggle -->
            <div class="form-group full-width">
              <label class="form-toggle">
                <div class="toggle-switch">
                  <input type="checkbox" id="cir-lio" />
                  <span class="toggle-track"></span>
                </div>
                <span class="toggle-label">LIO Implantada?</span>
              </label>
            </div>
            <div id="grupo-lio" style="display: none" class="full-width">
              <div class="form-grid form-grid-2">
                <div class="form-group">
                  <label class="form-label" for="cir-tipo-lio"
                    >Tipo de LIO</label
                  >
                  <select id="cir-tipo-lio" class="form-select">
                    <option value="">Selecione...</option>
                    <option>Monofocal</option>
                    <option>Multifocal</option>
                    <option>Tórica</option>
                    <option>Multifocal Tórica</option>
                    <option>Premium</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="cir-modelo-lio"
                    >Modelo da LIO</label
                  >
                  <input
                    type="text"
                    id="cir-modelo-lio"
                    class="form-input"
                    placeholder="Ex: AcrySof IQ"
                  />
                </div>
                <div class="form-group full-width">
                  <label class="form-label" for="cir-valor-lio"
                    >Valor da LIO (R$) <span class="required">*</span></label
                  >
                  <!-- CORRIGIDO: type=text com inputmode para formatação automática de moeda -->
                  <input
                    type="text"
                    inputmode="numeric"
                    id="cir-valor-lio"
                    class="form-input"
                    oninput="formatarMoedaInput(this)"
                    placeholder="R$ 0,00"
                    data-valor="0"
                  />
                </div>
              </div>
            </div>

            <div class="form-group full-width">
              <label class="form-label" for="cir-valor-total"
                >Valor Total da Cirurgia (R$)
                <span class="required">*</span></label
              >
              <!-- CORRIGIDO: type=text com inputmode para formatação automática de moeda -->
              <input
                type="text"
                inputmode="numeric"
                id="cir-valor-total"
                class="form-input"
                oninput="formatarMoedaInput(this)"
                placeholder="R$ 0,00"
                data-valor="0"
                required
              />
            </div>
          </div>
          <div class="form-actions">
            <button
              type="submit"
              class="btn btn-primary w-full"
              id="btn-salvar-cir"
            >
              <i
                data-lucide="save"
                width="16"
                height="16"
                aria-hidden="true"
              ></i>
              <span id="btn-cir-txt">Registrar Cirurgia</span>
            </button>
          </div>
          <input type="hidden" id="cir-edit-id" />
        </form>
      </div>
    </div>
  </div>

  <!-- Tabela — largura total -->
  <div>
    <div class="table-container">
      <div class="table-toolbar">
        <span class="table-toolbar-title">Cirurgias Registradas</span>
        <div class="table-actions" id="acoes-tabela-cir"></div>
      </div>
      <div class="table-scroll table-mobile-cards">
        <table
          class="data-table"
          id="tabela-cirurgico"
          aria-label="Cirurgias registradas"
        >
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Paciente</th>
              <th scope="col">Cirurgião</th>
              <th scope="col">Auxiliar</th>
              <th scope="col">Tipo</th>
              <th scope="col">Olho</th>
              <th scope="col">LIO</th>
              <th scope="col">Valor LIO</th>
              <th scope="col">Valor Total</th>
              <th scope="col">Honorários</th>
              <th scope="col">Ações</th>
            </tr>
          </thead>
          <tbody id="tbody-cirurgico">
            <tr>
              <td colspan="11">
                <div class="loading-wrapper">
                  <div class="spinner"></div>
                  Carregando...
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
