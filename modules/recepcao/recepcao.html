<div class="page-content">
  <!-- Cabeçalho -->
  <div class="module-header">
    <h1 class="module-title">
      <i
        data-lucide="clipboard-list"
        width="24"
        height="24"
        aria-hidden="true"
      ></i>
      Recepção
    </h1>
    <p class="module-subtitle">Registro de atendimentos do dia</p>
  </div>

  <!-- Seletor de data -->
  <div class="date-filter-bar">
    <label class="form-label" for="data-recepcao">Data:</label>
    <input
      type="date"
      id="data-recepcao"
      class="filter-input"
      style="width: auto"
    />
  </div>

  <!-- Cards de totais -->
  <div class="cards-grid cards-grid-4" id="cards-recepcao">
    <div class="card">
      <div class="card-header">
        <span class="card-label">Total Base</span>
        <div class="card-icon icon-red">
          <i
            data-lucide="trending-up"
            width="18"
            height="18"
            aria-hidden="true"
          ></i>
        </div>
      </div>
      <div class="card-value" id="val-base">R$ 0,00</div>
      <div class="card-meta" id="meta-base">0 pacientes</div>
      <div class="card-bar bar-danger"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-label">Total Indicações</span>
        <div class="card-icon icon-green">
          <i data-lucide="users" width="18" height="18" aria-hidden="true"></i>
        </div>
      </div>
      <div class="card-value" id="val-ind">R$ 0,00</div>
      <div class="card-meta" id="meta-ind">0 pacientes</div>
      <div class="card-bar bar-success"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-label">Total Leads</span>
        <div class="card-icon icon-blue">
          <i
            data-lucide="activity"
            width="18"
            height="18"
            aria-hidden="true"
          ></i>
        </div>
      </div>
      <div class="card-value" id="val-lead">R$ 0,00</div>
      <div class="card-meta" id="meta-lead">0 pacientes</div>
      <div class="card-bar bar-info"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-label">Total Geral</span>
        <div class="card-icon icon-blue">
          <i
            data-lucide="dollar-sign"
            width="18"
            height="18"
            aria-hidden="true"
          ></i>
        </div>
      </div>
      <div class="card-value" id="val-geral">R$ 0,00</div>
      <div class="card-meta" id="meta-geral">0 pacientes</div>
      <div class="card-bar bar-accent"></div>
    </div>
  </div>

  <!-- Layout dois painéis -->
  <div class="module-grid">
    <!-- Formulário -->
    <div>
      <div class="form-section">
        <h2 class="form-section-title">
          <i
            data-lucide="plus-circle"
            width="18"
            height="18"
            aria-hidden="true"
          ></i>
          Novo Atendimento
        </h2>
        <form id="form-recepcao" novalidate>
          <div class="form-grid">
            <div class="form-group full-width">
              <label class="form-label" for="rec-paciente"
                >Nome do Paciente <span class="required">*</span></label
              >
              <input
                type="text"
                id="rec-paciente"
                class="form-input"
                placeholder="Nome completo"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="rec-medico"
                >Médico <span class="required">*</span></label
              >
              <select id="rec-medico" class="form-select" required>
                <option value="">Selecione...</option>
                <option>Dra. Mariza</option>
                <option>Dra. Fabiana</option>
                <option>Dra. Mariana</option>
                <option>Dr. Dante</option>
                <option>Dr. Alberto</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="rec-tipo"
                >Tipo de Atendimento <span class="required">*</span></label
              >
              <select id="rec-tipo" class="form-select" required>
                <option value="">Selecione...</option>
                <option>Consulta</option>
                <option>Retorno</option>
                <option>Exame</option>
                <option>Pré-operatório</option>
                <option>Pós-operatório</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="rec-origem"
                >Origem <span class="required">*</span></label
              >
              <select id="rec-origem" class="form-select" required>
                <option value="">Selecione...</option>
                <option>Base</option>
                <option>Indicação</option>
                <option>Lead</option>
                <option>Convênio</option>
              </select>
            </div>
            <div class="form-group" id="grupo-convenio" style="display: none">
              <label class="form-label" for="rec-convenio">Convênio</label>
              <select id="rec-convenio" class="form-select">
                <option value="">Selecione...</option>
                <option>Particular</option>
                <option>Unimed</option>
                <option>Bradesco Saúde</option>
                <option>SulAmérica</option>
                <option>Amil</option>
                <option>Outro</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="rec-valor"
                >Valor (R$) <span class="required">*</span></label
              >
              <!-- CORRIGIDO: type=text com inputmode para formatação automática de moeda -->
              <input
                type="text"
                inputmode="numeric"
                id="rec-valor"
                class="form-input"
                oninput="formatarMoedaInput(this)"
                placeholder="R$ 0,00"
                data-valor="0"
                required
              />
            </div>
          </div>
          <div class="form-actions">
            <button
              type="submit"
              class="btn btn-primary w-full"
              id="btn-salvar-recepcao"
            >
              <i
                data-lucide="save"
                width="16"
                height="16"
                aria-hidden="true"
              ></i>
              <span id="btn-salvar-txt">Salvar Atendimento</span>
            </button>
          </div>
          <input type="hidden" id="rec-edit-id" />
        </form>
      </div>
    </div>

    <!-- Tabela -->
    <div>
      <div class="table-container">
        <div class="table-toolbar">
          <span class="table-toolbar-title">Atendimentos do Dia</span>
          <div class="table-actions" id="acoes-tabela-rec"></div>
        </div>
        <div class="table-scroll table-mobile-cards">
          <table
            class="data-table"
            id="tabela-recepcao"
            aria-label="Atendimentos do dia"
          >
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Paciente</th>
                <th scope="col">Médico</th>
                <th scope="col">Tipo</th>
                <th scope="col">Origem</th>
                <th scope="col">Valor</th>
                <th scope="col" class="admin-only" hidden>Registrado por</th>
                <th scope="col">Ações</th>
              </tr>
            </thead>
            <tbody id="tbody-recepcao">
              <tr>
                <td colspan="8">
                  <div class="loading-wrapper">
                    <div class="spinner"></div>
                    Carregando...
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="paginacao-recepcao"></div>
      </div>
    </div>
  </div>
</div>
