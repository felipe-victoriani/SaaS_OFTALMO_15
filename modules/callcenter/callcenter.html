<div class="page-content">
  <div class="module-header">
    <h1 class="module-title">
      <i data-lucide="phone-call" width="24" height="24" aria-hidden="true"></i>
      Call Center
    </h1>
    <p class="module-subtitle">
      Reativação de pacientes — registro de ligações
    </p>
  </div>

  <div class="date-filter-bar">
    <label class="form-label" for="data-callcenter">Data:</label>
    <input
      type="date"
      id="data-callcenter"
      class="filter-input"
      style="width: auto"
    />
  </div>

  <div class="cards-grid cards-grid-4" id="cards-cc">
    <div class="card">
      <div class="card-header">
        <span class="card-label">Ligações</span>
        <div class="card-icon icon-blue">
          <i data-lucide="phone" width="18" height="18" aria-hidden="true"></i>
        </div>
      </div>
      <div class="card-value" id="cc-total">0</div>
      <div class="card-meta">realizadas</div>
      <div class="card-bar bar-accent"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-label">Atendidos</span>
        <div class="card-icon icon-green">
          <i
            data-lucide="phone-incoming"
            width="18"
            height="18"
            aria-hidden="true"
          ></i>
        </div>
      </div>
      <div class="card-value" id="cc-atendidos">0</div>
      <div class="card-meta">atenderam</div>
      <div class="card-bar bar-success"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-label">Reagendados</span>
        <div class="card-icon icon-yellow">
          <i
            data-lucide="calendar-check"
            width="18"
            height="18"
            aria-hidden="true"
          ></i>
        </div>
      </div>
      <div class="card-value" id="cc-reagendados">0</div>
      <div class="card-meta">confirmados</div>
      <div class="card-bar bar-warning"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-label">Conversão</span>
        <div class="card-icon icon-blue">
          <i
            data-lucide="trending-up"
            width="18"
            height="18"
            aria-hidden="true"
          ></i>
        </div>
      </div>
      <div class="card-value" id="cc-taxa">0%</div>
      <div class="card-meta">reagend. / ligações</div>
      <div class="card-bar bar-info"></div>
    </div>
  </div>

  <div class="module-grid">
    <!-- Formulário -->
    <div>
      <div class="form-section">
        <h2 class="form-section-title">
          <i
            data-lucide="phone-outgoing"
            width="18"
            height="18"
            aria-hidden="true"
          ></i>
          Nova Ativação
        </h2>
        <form id="form-callcenter" novalidate>
          <div class="form-grid">
            <div class="form-group full-width">
              <label class="form-label" for="cc-paciente"
                >Nome do Paciente <span class="required">*</span></label
              >
              <input type="text" id="cc-paciente" class="form-input" required />
            </div>
            <div class="form-group full-width">
              <label class="form-label" for="cc-telefone"
                >Telefone <span class="required">*</span></label
              >
              <input
                type="tel"
                id="cc-telefone"
                class="form-input"
                placeholder="(00) 00000-0000"
                required
              />
            </div>
            <div class="form-group full-width">
              <label class="form-label" for="cc-ultimo"
                >Último Atendimento</label
              >
              <input type="date" id="cc-ultimo" class="form-input" />
            </div>
            <div class="form-group full-width">
              <label class="form-toggle">
                <div class="toggle-switch">
                  <input type="checkbox" id="cc-atendeu" />
                  <span class="toggle-track"></span>
                </div>
                <span class="toggle-label">Atendeu?</span>
              </label>
            </div>
            <div
              class="form-group full-width"
              id="grupo-reagendou"
              style="opacity: 0.5; pointer-events: none"
            >
              <label class="form-toggle">
                <div class="toggle-switch">
                  <input type="checkbox" id="cc-reagendou" disabled />
                  <span class="toggle-track"></span>
                </div>
                <span class="toggle-label">Reagendou?</span>
              </label>
            </div>
            <div
              class="form-group full-width"
              id="grupo-data-reag"
              style="display: none"
            >
              <label class="form-label" for="cc-data-reag"
                >Data do Reagendamento</label
              >
              <input type="date" id="cc-data-reag" class="form-input" />
            </div>
            <div class="form-group full-width">
              <label class="form-label" for="cc-obs">Observações</label>
              <textarea id="cc-obs" class="form-textarea" rows="3"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button
              type="submit"
              class="btn btn-primary w-full"
              id="btn-salvar-cc"
            >
              <i
                data-lucide="save"
                width="16"
                height="16"
                aria-hidden="true"
              ></i>
              <span id="btn-cc-txt">Salvar Ativação</span>
            </button>
          </div>
          <input type="hidden" id="cc-edit-id" />
        </form>
      </div>
    </div>

    <!-- Tabela -->
    <div>
      <div class="table-container">
        <div class="table-toolbar">
          <span class="table-toolbar-title">Registros do Dia</span>
          <div class="table-actions" id="acoes-tabela-cc"></div>
        </div>
        <div class="table-scroll table-mobile-cards">
          <table
            class="data-table"
            id="tabela-callcenter"
            aria-label="Registros de call center"
          >
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Paciente</th>
                <th scope="col">Telefone</th>
                <th scope="col">Último Atend.</th>
                <th scope="col">Atendeu</th>
                <th scope="col">Reagendou</th>
                <th scope="col">Data Reag.</th>
                <th scope="col" class="admin-only" hidden>Atendente</th>
                <th scope="col">Ações</th>
              </tr>
            </thead>
            <tbody id="tbody-cc">
              <tr>
                <td colspan="9">
                  <div class="loading-wrapper">
                    <div class="spinner"></div>
                    Carregando...
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="paginacao-cc"></div>
      </div>
    </div>
  </div>
</div>
