<div class="page-content">
  <div class="module-header">
    <h1 class="module-title">
      <i
        data-lucide="bar-chart-3"
        width="24"
        height="24"
        aria-hidden="true"
      ></i>
      Faturamento
    </h1>
    <p class="module-subtitle">
      Visão financeira consolidada por médico e período
    </p>
  </div>

  <!-- Filtro -->
  <div
    style="
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    "
  >
    <label class="form-label" style="margin: 0">Mês/Ano:</label>
    <input type="month" id="fat-mes" class="filter-input" style="width: auto" />
  </div>

  <!-- Card Clínica CNPJ em destaque (admin — renderizado antes dos médicos) -->
  <div id="fat-card-clinica" class="mb-3"></div>

  <!-- Cards por médico (grid 3 colunas) -->
  <div class="cards-grid cards-grid-3" id="fat-cards-medicos">
    <div class="card" style="grid-column: 1/-1">
      <div class="loading-wrapper">
        <div class="spinner"></div>
        Carregando...
      </div>
    </div>
  </div>

  <!-- Charts de honorários -->
  <div class="cards-grid mt-3" style="grid-template-columns: 2fr 1fr">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Faturamento por Médico</span>
      </div>
      <canvas id="chart-por-medico" height="180"></canvas>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">Progresso de Metas</span>
      </div>
      <div id="fat-metas-progress"></div>
    </div>
  </div>

  <!-- ALTERAÇÃO 5: Seção de gráficos da receita da recepção -->
  <section id="secao-graficos-recepcao" class="mt-3" style="display: none">
    <div class="card-header" style="padding: 0.5rem 0 0.75rem">
      <span class="card-title" style="font-size: 1rem; font-weight: 700">
        <i
          data-lucide="bar-chart-2"
          width="18"
          height="18"
          aria-hidden="true"
        ></i>
        Receita da Recepção
      </span>
    </div>
    <div class="graficos-grid-3">
      <div class="chart-card card">
        <div class="card-header">
          <span class="card-title">Por Médico</span>
        </div>
        <canvas id="chart-recepcao-medico" height="200"></canvas>
      </div>
      <div class="chart-card card">
        <div class="card-header">
          <span class="card-title">Por Origem</span>
        </div>
        <canvas id="chart-recepcao-origem" height="200"></canvas>
      </div>
    </div>
  </section>
</div>
